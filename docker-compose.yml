# Session server (CLAUDE.md §1, §7). Copy .env.example to .env, set DND_HOST_TOKEN, then:
#   docker compose up -d
#
# Optional TLS profile with automatic certificates (R2.2):
#   DND_DOMAIN=dnd.example.org DND_BIND_ADDR=127.0.0.1 docker compose --profile tls up -d
# See docs/self-hosting.md.
services:
  session-server:
    build:
      context: .
      dockerfile: apps/session-server/Dockerfile
    # A published image can be used instead of building:
    #   DND_SERVER_IMAGE=ghcr.io/OWNER/REPO/session-server:0.1.0 docker compose up -d --pull always --no-build
    image: ${DND_SERVER_IMAGE:-dnd-session-server:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DND_DATA_DIR: /data
      DND_BIND: 0.0.0.0:8080
    ports:
      # With the TLS profile bind the host side to loopback (DND_BIND_ADDR=127.0.0.1) and let Caddy
      # reach the service over the compose network.
      - '${DND_BIND_ADDR:-0.0.0.0}:${DND_PORT:-8080}:8080'
    volumes:
      - dnd-data:/data
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', '/usr/local/bin/dnd-session-server', 'healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    depends_on:
      - session-server
    environment:
      DND_DOMAIN: ${DND_DOMAIN:?set DND_DOMAIN for the TLS profile}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  dnd-data:
  caddy-data:
  caddy-config:
