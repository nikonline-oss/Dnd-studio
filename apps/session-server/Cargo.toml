[package]
name = "dnd-session-server"
description = "Self-hosted authoritative session server (axum + game-core + SQLite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "dnd_session_server"
path = "src/lib.rs"

[[bin]]
name = "dnd-session-server"
path = "src/main.rs"

[dependencies]
dnd-protocol.workspace = true
dnd-game-core.workspace = true
dnd-db.workspace = true
dnd-assets.workspace = true
dnd-plugin.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util", "net"] }
axum.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
argon2.workspace = true
getrandom.workspace = true

[dev-dependencies]
dnd-protocol = { workspace = true, features = ["arbitrary"] }
tempfile.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
zip.workspace = true
sha2.workspace = true

[lints]
workspace = true
