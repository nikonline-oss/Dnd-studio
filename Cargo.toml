[workspace]
resolver = "3"
members = [
    "crates/dnd-protocol",
    "crates/dnd-game-core",
    "crates/dnd-dice",
    "crates/dnd-expr",
    "crates/dnd-db",
    "crates/dnd-plugin",
    "crates/dnd-assets",
    "crates/dnd-net",
    "apps/session-server",
    "apps/desktop/src-tauri",
    "tools/plugin-tool",
    "tools/spike-map-gen",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikonline-oss/Dnd-studio"
publish = false

# Versions checked against crates.io on 2026-10-20 (CLAUDE.md §3).
# Pre-release crates are pinned exactly.
[workspace.dependencies]
# internal
dnd-protocol = { path = "crates/dnd-protocol" }
dnd-game-core = { path = "crates/dnd-game-core" }
dnd-dice = { path = "crates/dnd-dice" }
dnd-expr = { path = "crates/dnd-expr" }
dnd-db = { path = "crates/dnd-db" }
dnd-plugin = { path = "crates/dnd-plugin" }
dnd-assets = { path = "crates/dnd-assets" }
dnd-net = { path = "crates/dnd-net" }

# errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# serialization / types
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: positions/sizes must survive JSON exactly (found by proptest).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# desktop (Tauri 2)
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

# parsing (dice and expression grammars)
winnow = "1.0.4"

# runtime / storage
# hashing (CLAUDE.md §3)
sha2 = "0.11.1"
# Campaign archives (CLAUDE.md §3, §6); deflate only (zlib-rs), no other codecs or encryption.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# image encoding (CLAUDE.md §3); default features pull in `image`, not needed yet
webp = { version = "0.3.1", default-features = false }
# Decoding imported images; only the formats we accept (CLAUDE.md §3).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

tokio = { version = "1.54.0" }

# session server (CLAUDE.md §3, ADR-0022)
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
# Secrets: argon2 hashes for GM keys and access codes (CLAUDE.md §6), OS randomness.
argon2 = "0.6.0"
getrandom = "0.4.3"
# Client side of the session server (dnd-net) and server tests; TLS through rustls + ring, as
# Tauri already uses (no aws-lc build).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "http2"] }
tokio-tungstenite = "0.30.0"
# The crypto provider reqwest needs when Tauri's `rustls-no-provider` is unified in (ring, as Tauri).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.9.0", default-features = false }

# observability
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# tests
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json", "yaml"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

# Image decoding/encoding is unusably slow unoptimized (map import in `tauri dev`, asset tests).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
