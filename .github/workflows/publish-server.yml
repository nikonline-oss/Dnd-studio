name: Publish session server image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 0.1.0-rc.1)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/session-server

jobs:
  publish:
    name: Build, smoke-test and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/session-server/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
      - name: Smoke test
        run: |
          docker run -d --name dnd -e DND_HOST_TOKEN=ci-host-token-0123456789 -p 8080:8080 ${{ env.IMAGE }}:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          docker exec dnd /usr/local/bin/dnd-session-server healthcheck
          docker rm -f dnd
      # Push only after the smoke test: a broken image never reaches the registry.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/session-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
